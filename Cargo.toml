[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
learning-core = { path = "crates/core" }
anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
mime_guess = "2"
open = "5"
rust-embed = { version = "8", features = ["include-exclude"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
fsrs = "6.6"
rmcp = { version = "3.7", features = ["server", "transport-io"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tempfile = "3"
thiserror = "2"
ts-rs = { version = "12", features = ["chrono-impl", "no-serde-warnings"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "limit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
